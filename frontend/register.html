<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Job Assistant</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Auth CSS -->

</head>

<body>

<div class="login-container">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-6 col-md-8">

<div class="login-card">

<div class="text-center mb-4">

<h2 class="fw-bold text-primary">

Create Account

</h2>

<p class="text-muted">

Start your AI-powered job search journey 🚀

</p>

</div>

<form id="registerForm">

<!-- Full Name -->

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person"></i>

</span>

<input

type="text"

class="form-control"

id="name"

placeholder="Enter your full name"

required>

</div>

</div>

<!-- Email -->

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-envelope"></i>

</span>

<input

type="email"

class="form-control"

id="email"

placeholder="Enter your email"

required>

</div>

</div>

<!-- Phone -->

<div class="mb-3">

<label class="form-label">

Phone Number

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-telephone"></i>

</span>

<input

type="tel"

class="form-control"

id="phone"

placeholder="+91 9876543210"

required>

</div>

</div>

<!-- Password -->

<div class="mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-lock"></i>

</span>

<input

type="password"

class="form-control"

id="password"

placeholder="Create password"

required>

<button

type="button"

class="btn btn-outline-secondary"

id="togglePassword">

<i class="bi bi-eye"></i>

</button>

</div>

<!-- Password Strength -->

<div class="mt-2">

<div class="progress" style="height:8px;">

<div

id="strengthBar"

class="progress-bar"

style="width:0%">

</div>

</div>

<small id="strengthText" class="text-light">

Password Strength

</small>

</div>

</div>

<!-- Confirm Password -->

<div class="mb-3">

<label class="form-label">

Confirm Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-shield-lock"></i>

</span>

<input

type="password"

class="form-control"

id="confirmPassword"

placeholder="Confirm password"

required>

</div>

</div>

<!-- Terms -->

<div class="form-check mb-4">

<input

class="form-check-input"

type="checkbox"

id="terms"

required>

<label

class="form-check-label"

for="terms">

I agree to the Terms & Conditions

</label>

</div>

<!-- Register Button -->

<div class="d-grid mb-3">

<button

type="submit"

class="btn btn-primary btn-lg">

<i class="bi bi-person-plus"></i>

Create Account

</button>

</div>

<!-- Divider -->

<div class="text-center mb-3">

<span class="text-muted">

or

</span>

</div>

<!-- Google -->

<div class="d-grid mb-4">

<button

type="button"

class="btn btn-outline-dark"

id="googleRegister">

<i class="bi bi-google"></i>

Continue with Google

</button>

</div>

<div class="text-center">

Already have an account?

<a href="login.html"

class="fw-bold text-decoration-none">

Login

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Register JS -->

<script>
    // ==========================================
// AI Job Assistant - Register Script
// ==========================================

const registerForm = document.getElementById("registerForm");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");

const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");

const togglePassword = document.getElementById("togglePassword");

const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

// ==========================================
// Password Toggle
// ==========================================

togglePassword.addEventListener("click", () => {

    const icon = togglePassword.querySelector("i");

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    }else{

        passwordInput.type = "password";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

});

// ==========================================
// Email Validation
// ==========================================

function validEmail(email){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}

// ==========================================
// Phone Validation
// ==========================================

function validPhone(phone){

    return /^[0-9+\-\s]{10,15}$/.test(phone);

}

// ==========================================
// Password Strength
// ==========================================

passwordInput.addEventListener("input", ()=>{

    const pwd = passwordInput.value;

    let score = 0;

    if(pwd.length >= 8) score++;
    if(/[A-Z]/.test(pwd)) score++;
    if(/[0-9]/.test(pwd)) score++;
    if(/[!@#$%^&*]/.test(pwd)) score++;

    switch(score){

        case 1:
            strengthBar.style.width="25%";
            strengthBar.className="progress-bar bg-danger";
            strengthText.innerHTML="Weak";
            break;

        case 2:
            strengthBar.style.width="50%";
            strengthBar.className="progress-bar bg-warning";
            strengthText.innerHTML="Fair";
            break;

        case 3:
            strengthBar.style.width="75%";
            strengthBar.className="progress-bar bg-info";
            strengthText.innerHTML="Good";
            break;

        case 4:
            strengthBar.style.width="100%";
            strengthBar.className="progress-bar bg-success";
            strengthText.innerHTML="Strong";
            break;

        default:
            strengthBar.style.width="0%";
            strengthText.innerHTML="Password Strength";

    }

});

// ==========================================
// Bootstrap Alert
// ==========================================

function showAlert(type,message){

    const old=document.querySelector(".custom-alert");

    if(old) old.remove();

    const div=document.createElement("div");

    div.className=`alert alert-${type} custom-alert`;

    div.innerHTML=message;

    registerForm.prepend(div);

    setTimeout(()=>{

        div.remove();

    },4000);

}

// ==========================================
// Loading Button
// ==========================================

function setLoading(btn,state){

    if(state){

        btn.disabled=true;

        btn.innerHTML=`
        <span class="spinner-border spinner-border-sm me-2"></span>
        Creating Account...
        `;

    }else{

        btn.disabled=false;

        btn.innerHTML=`
        <i class="bi bi-person-plus"></i>
        Create Account
        `;

    }

}

// ==========================================
// Register
// ==========================================

registerForm.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const name=nameInput.value.trim();
    const email=emailInput.value.trim();
    const phone=phoneInput.value.trim();

    const password=passwordInput.value;
    const confirm=confirmInput.value;

    if(!name || !email || !phone || !password){

        showAlert("danger","Please complete all fields.");

        return;

    }

    if(!validEmail(email)){

        showAlert("warning","Invalid email.");

        return;

    }

    if(!validPhone(phone)){

        showAlert("warning","Invalid phone number.");

        return;

    }

    if(password!==confirm){

        showAlert("danger","Passwords do not match.");

        return;

    }

    const btn=registerForm.querySelector("button[type='submit']");

    setLoading(btn,true);

    try{

        const response=await fetch(
            "/api/auth/register",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    full_name: name,
                    email,
                    phone,
                    password

                })

            });

        const data=await response.json();

        if(!response.ok){

            throw new Error(data.message);

        }

        showAlert(

            "success",

            "Account created successfully!"

        );

        setTimeout(()=>{

            window.location.href="login.html";

        },1500);

    }

    catch(error){

        showAlert(

            "danger",

            error.message || "Registration failed."

        );

    }

    finally{

        setLoading(btn,false);

    }

});

// ==========================================
// Google Register Placeholder
// ==========================================

document
.getElementById("googleRegister")
.addEventListener("click",()=>{

    alert("Google Sign-Up will be connected later.");

});
</script>
<style>
    /* ==========================================
REGISTER PAGE
========================================== */

body{
    min-height:100vh;
}

/* Larger Card */

.login-card{

    max-width:650px;

    margin:auto;

}

/* Input Groups */

.input-group{

    border-radius:12px;

    overflow:hidden;

}

.input-group-text{

    width:50px;

    justify-content:center;

}

/* Progress Bar */

.progress{

    height:8px;

    border-radius:20px;

    background:#d1d5db;

}

.progress-bar{

    transition:all .3s ease;

}

/* Password Strength */

#strengthText{

    display:block;

    margin-top:8px;

    font-size:14px;

    font-weight:500;

    color:#fff;

}

/* Form Checkbox */

.form-check{

    margin-top:10px;

}

.form-check-label{

    color:#fff;

}

/* Buttons */

.btn{

    border-radius:12px;

    transition:.3s;

}

.btn:hover{

    transform:translateY(-2px);

}

/* Google Button */

#googleRegister{

    background:#fff;

}

#googleRegister:hover{

    background:#f8f9fa;

}

/* Alerts */

.custom-alert{

    border-radius:12px;

}

/* Links */

.login-card a{

    color:#fff;

    font-weight:600;

}

.login-card a:hover{

    color:#dbeafe;

}

/* Mobile */

@media(max-width:768px){

.login-card{

padding:30px;

}

}

@media(max-width:576px){

.login-card{

padding:20px;

}

.form-control{

height:50px;

}

.btn{

height:50px;

}

}
</style>

</body>

</html>
