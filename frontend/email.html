<style>
    /* ==========================================
   EMAIL PAGE
========================================== */

body {
    background: #f4f7fb;
}

/* ==========================================
Dashboard Box
========================================== */

.dashboard-box {
    background: #ffffff;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

/* ==========================================
Toolbar
========================================== */

.form-control {
    height: 50px;
    border-radius: 12px;
    border: 1px solid #d9e2ef;
}

.form-control:focus {
    border-color: #2563eb;
    box-shadow: none;
}

/* ==========================================
Compose Button
========================================== */

#composeBtn {

    padding: 12px 24px;

    border-radius: 12px;

    font-weight: 600;

}

/* ==========================================
Folders
========================================== */

.list-group-item {

    border: none;

    padding: 15px 18px;

    margin-bottom: 10px;

    border-radius: 12px !important;

    cursor: pointer;

    transition: .3s;

    font-weight: 500;

}

.list-group-item:hover {

    background: #eef4ff;

}

.list-group-item.active {

    background: #2563eb;

    color: #fff;

}

/* ==========================================
AI Buttons
========================================== */

.dashboard-box .btn {

    border-radius: 10px;

}

/* ==========================================
Table
========================================== */

.table {

    margin-bottom: 0;

}

.table thead {

    background: #f8fafc;

}

.table th {

    padding: 16px;

    font-weight: 700;

    white-space: nowrap;

}

.table td {

    padding: 18px;

    vertical-align: middle;

}

/* ==========================================
Status Badges
========================================== */

.badge {

    padding: 8px 14px;

    font-size: 13px;

    border-radius: 20px;

}

/* ==========================================
Open Button
========================================== */

.table .btn {

    border-radius: 10px;

}

/* ==========================================
Hover Effect
========================================== */

tbody tr {

    transition: .25s;

}

tbody tr:hover {

    background: #f8fafc;

}

/* ==========================================
Unread Email
========================================== */

.email-unread {

    font-weight: 700;

}

/* ==========================================
Read Email
========================================== */

.email-read {

    color: #6b7280;

}

/* ==========================================
AI Summary Card
========================================== */

.ai-summary {

    background: #eef6ff;

    border-left: 5px solid #2563eb;

    border-radius: 12px;

    padding: 15px;

    margin-top: 20px;

}

/* ==========================================
Compose Modal
========================================== */

.modal-content {

    border-radius: 18px;

}

.modal textarea {

    resize: none;

}

/* ==========================================
Dark Mode
========================================== */

.dark-mode {

    background: #0f172a;

}

.dark-mode .dashboard-box {

    background: #1e293b;

    color: white;

}

.dark-mode .table {

    color: white;

}

.dark-mode .table thead {

    background: #334155;

}

.dark-mode tbody tr:hover {

    background: #334155;

}

.dark-mode .form-control {

    background: #334155;

    color: white;

    border: 1px solid #475569;

}

.dark-mode .form-control::placeholder {

    color: #cbd5e1;

}

.dark-mode .list-group-item {

    background: #1e293b;

    color: white;

}

.dark-mode .list-group-item:hover {

    background: #334155;

}

/* ==========================================
Responsive
========================================== */

@media(max-width:992px){

    .table{

        min-width:750px;

    }

}

@media(max-width:768px){

    .dashboard-box{

        padding:18px;

    .table td{

</style>
<script>
    // ==========================================
// AI Job Assistant - Email Center
// ==========================================

// Sample Email Data
let emails = [
    {
        id: 1,
        sender: "Google Careers",
        subject: "Frontend Developer Interview Invitation",
        date: "Today",
        status: "New",
        body: "Congratulations! We'd like to invite you for a technical interview."
    },
    {
        id: 2,
        sender: "Amazon Recruiting",
        subject: "Online Assessment Completed",
        date: "Yesterday",
        status: "Pending",
        body: "Your assessment has been received and is under review."
    },
    {
        id: 3,
        sender: "Microsoft HR",
        subject: "Application Under Review",
        date: "2 Days Ago",
        status: "Read",
        body: "Your application has been forwarded to the hiring manager."
    }
];

// Elements
const emailTable = document.getElementById("emailTable");
const searchInput = document.getElementById("emailSearch");
const composeBtn = document.getElementById("composeBtn");

// ============================
// Badge Color
// ============================

function badge(status){

    switch(status){

        case "New":
            return "bg-success";

        case "Pending":
            return "bg-warning";

        case "Read":
            return "bg-info";

        default:
            return "bg-secondary";

    }

}

// ============================
// Render Emails
// ============================

function renderEmails(data){

    emailTable.innerHTML="";

    if(data.length===0){

        emailTable.innerHTML=`
        <tr>
            <td colspan="5" class="text-center">
                No emails found.
            </td>
        </tr>
        `;

        return;

    }

    data.forEach(email=>{

        emailTable.innerHTML+=`

        <tr>

            <td>${email.sender}</td>

            <td>${email.subject}</td>

            <td>${email.date}</td>

            <td>

                <span class="badge ${badge(email.status)}">

                    ${email.status}

                </span>

            </td>

            <td>

                <button
                    class="btn btn-primary btn-sm openBtn"
                    data-id="${email.id}">

                    Open

                </button>

            </td>

        </tr>

        `;

    });

    attachEvents();

}

// ============================
// Search
// ============================

function searchEmails(){

    const keyword = searchInput.value.toLowerCase();

    const filtered = emails.filter(email=>

        email.sender.toLowerCase().includes(keyword)

        ||

        email.subject.toLowerCase().includes(keyword)

    );

    renderEmails(filtered);

}

searchInput.addEventListener("keyup",searchEmails);

// ============================
// Open Email
// ============================

function attachEvents(){

    document.querySelectorAll(".openBtn")
    .forEach(btn=>{

        btn.onclick=()=>{

            const id=Number(btn.dataset.id);

            const email=emails.find(e=>e.id===id);

            alert(

`From: ${email.sender}

Subject: ${email.subject}

--------------------------------

${email.body}`

            );

        };

    });

}

// ============================
// Compose
// ============================

composeBtn.addEventListener("click",()=>{

    const to = prompt("Recipient Email:");

    if(!to) return;

    const subject = prompt("Subject:");

    if(subject===null) return;

    const message = prompt("Message:");

    if(message===null) return;

    alert(
`Email queued.

To: ${to}

Subject: ${subject}

(Backend integration will send it.)`
    );

});

// ============================
// Folder Buttons
// ============================

document.querySelectorAll(".list-group-item")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        document
        .querySelectorAll(".list-group-item")
        .forEach(item=>item.classList.remove("active"));

        btn.classList.add("active");

    });

});

// ============================
// AI Buttons
// ============================

const aiButtons =
document.querySelectorAll(".dashboard-box .btn-success, .dashboard-box .btn-warning, .dashboard-box .btn-info");

if(aiButtons.length>=3){

    aiButtons[0].onclick=()=>{

        alert(
`AI Summary

• 2 recruitment emails
• 1 interview invitation
• 1 application review

Backend AI will generate detailed summaries later.`
        );

    };

    aiButtons[1].onclick=()=>{

        alert(
"AI Reply Generator will be connected to OpenAI."
        );

    };

    aiButtons[2].onclick=()=>{

        alert(
"AI Follow-up Email Generator coming soon."
        );

    };

}

// ============================
// Refresh
// ============================

renderEmails(emails);

// ============================
// Load Real Emails From Backend
// (falls back to sample data above if the
// API is unreachable or returns nothing yet)
// ============================

async function loadEmailsFromServer() {

    const token = localStorage.getItem("token");

    if (!token) return;

    try {

        const response = await fetch(
            "/api/email",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        if (!response.ok) return;

        const data = await response.json();

        if (!data.success || !data.emails || data.emails.length === 0) return;

        emails = data.emails.map(mail => ({
            id: mail.id,
            sender: mail.sender,
            subject: mail.subject,
            date: new Date(mail.received_at).toDateString(),
            status: mail.email_status || "New",
            body: mail.body
        }));

        renderEmails(emails);

    } catch (error) {

        console.warn("Could not load emails from server, showing sample data.", error);

    }

}

loadEmailsFromServer();

console.log("Email Center Loaded Successfully 🚀");
</script>

</body>
