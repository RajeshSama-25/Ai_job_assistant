services:
  - type: web
    name: ai-job-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-assistant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: BACKEND_URL
        fromService:
          type: web
          name: ai-job-assistant
          property: hostport
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ai-job-assistant
          property: hostport

databases:
  - name: ai-job-assistant-db
    plan: free
